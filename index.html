<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&lt;/&gt; ZIP_ARCHIVE_DOWNLOADER</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --border: #1f2937;
      --cyan: #06b6d4;
      --green: #10b981;
      --text: #9ca3af;
      --yellow: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace, 'Courier New', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .head-title {
      color: var(--cyan);
      font-weight: bold;
      font-size: 13px;
    }

    /* كارت تفاصيل الملف المضغوط */
    .archive-preview {
      background: #0b0f19;
      border: 1px dashed var(--cyan);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .archive-title {
      font-size: 14px;
      color: var(--yellow);
      font-weight: bold;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
    }

    .file-tree {
      font-size: 11px;
      color: var(--text);
      margin-top: 8px;
      padding-right: 10px;
      border-right: 2px solid var(--border);
    }

    .file-tree-item {
      margin-top: 4px;
      color: #d1d5db;
    }

    /* شريط التحميل */
    .progress-section {
      margin-top: 15px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: var(--cyan);
      transition: width 0.1s linear;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: 0.2s;
      margin-top: 16px;
    }

    .btn-action:hover {
      background: var(--cyan);
      color: #000;
    }

    .btn-action:disabled {
      border-color: var(--border);
      color: var(--text);
      cursor: not-allowed;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="head">
      <span class="head-title">[ ZIP_BUNDLE_MODULE ]</span>
      <span style="font-size: 11px; color: var(--text);">TARGET: PKG</span>
    </div>

    <div class="archive-preview">
      <div class="archive-title">
        <span>PACKAGE: Attendance_Bundle.zip</span>
        <span style="color: var(--cyan);">[ .ZIP ]</span>
      </div>
      <div style="font-size: 11px; color: var(--text);">CONTENTS_TO_COMPRESS:</div>
      <div class="file-tree">
        <div class="file-tree-item">├── الحضور.apk <span style="color: var(--text);">(APK)</span></div>
        <div class="file-tree-item">└── تطبيق الحضور للكمبيوتر.html <span style="color: var(--text);">(HTML)</span></div>
      </div>
    </div>

    <div class="progress-section">
      <div class="meta">
        <span id="stateText">STATUS: WAITING_FOR_ACTION</span>
        <span id="percText" style="color: var(--green); font-weight: bold;">0%</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="barFill"></div>
      </div>
    </div>

    <button class="btn-action" id="startBtn" onclick="processAndZip()">[ DOWNLOAD_AS_ZIP ]</button>
  </div>

  <script>
    // طلب صلاحية الإشعارات
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function notify(msg) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("ZIP_PROCESS_COMPLETE", { body: msg });
      }
    }

    async function fetchFile(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error("NETWORK_ERROR");
      return await response.blob();
    }

    async function processAndZip() {
      const btn = document.getElementById('startBtn');
      const bar = document.getElementById('barFill');
      const perc = document.getElementById('percText');
      const state = document.getElementById('stateText');

      btn.disabled = true;
      btn.innerText = "[ FETCHING_FILES... ]";

      const zip = new JSZip();

      const files = [
        { name: "الحضور.apk", url: "https://raw.githubusercontent.com/x7oud3-ai/-APK/main/الحضور.apk" },
        { name: "تطبيق الحضور للكمبيوتر.html", url: "https://raw.githubusercontent.com/x7oud3-ai/-APK/main/تطبيق%20الحضور%20للكمبيوتر.html" }
      ];

      try {
        // الخطوة 1: جلب الملفات (50% من شريط التقدم)
        state.innerText = "STATUS: DOWNLOADING_FILES...";
        
        const blob1 = await fetchFile(files[0].url);
        bar.style.width = "25%";
        perc.innerText = "25%";

        const blob2 = await fetchFile(files[1].url);
        bar.style.width = "50%";
        perc.innerText = "50%";

        // إضافة الملفات إلى الأرشيف
        zip.file(files[0].name, blob1);
        zip.file(files[1].name, blob2);

        // الخطوة 2: ضغط الملفات مع عداد مئوي للضغط حقيقي (من 50% لـ 100%)
        state.innerText = "STATUS: COMPRESSING_ZIP...";
        btn.innerText = "[ COMPRESSING_ARCHIVE... ]";

        const zipContent = await zip.generateAsync({ type: "blob" }, function updateCallback(metadata) {
          const currentPercent = Math.round(50 + (metadata.percent / 2));
          bar.style.width = currentPercent + "%";
          perc.innerText = currentPercent + "%";
        });

        // الخطوة 3: التنزيل التلقائي للملف المضغوط
        state.innerText = "STATUS: COMPLETE ✓";
        bar.style.backgroundColor = "var(--green)";
        
        const zipName = "Attendance_Bundle.zip";
        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipContent);
        link.download = zipName;
        document.body.appendChild(link);
        link.click();
        link.remove();

        notify(`File successfully bundled and downloaded: ${zipName}`);
        btn.innerText = "[ ARCHIVE_DOWNLOADED ]";

      } catch (error) {
        state.innerText = "STATUS: ERROR_FALLBACK";
        alert("حدث خطأ أثناء تحميل الملفات أو الضغط.");
        btn.disabled = false;
        btn.innerText = "[ RETRY ]";
      }
    }
  </script>
</body>
</html>
