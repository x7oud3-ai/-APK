<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>&lt;/&gt; SYSTEM_DOWNLOAD_INTERFACE</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --border: #1f2937;
      --cyan: #06b6d4;
      --green: #10b981;
      --text: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: monospace, 'Courier New', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #f3f4f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .wrapper {
      width: 100%;
      max-width: 500px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .head-title {
      color: var(--cyan);
      font-weight: bold;
      font-size: 14px;
    }

    .file-box {
      background: #0b0f19;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 6px;
      margin-bottom: 14px;
    }

    .file-meta {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .file-name {
      color: #e5e7eb;
    }

    .file-perc {
      color: var(--green);
      font-weight: bold;
    }

    .bar-bg {
      width: 100%;
      height: 6px;
      background: #1f2937;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      width: 0%;
      height: 100%;
      background: var(--cyan);
      transition: width 0.1s linear;
    }

    .details {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text);
      margin-top: 6px;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid var(--cyan);
      color: var(--cyan);
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-action:hover {
      background: var(--cyan);
      color: #000;
    }

    .btn-action:disabled {
      border-color: var(--border);
      color: var(--text);
      cursor: not-allowed;
      background: transparent;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="head">
      <span class="head-title">[ FETCH_REALTIME_STREAM ]</span>
      <span style="font-size: 11px; color: var(--text);">STATUS: READY</span>
    </div>

    <div class="file-box">
      <div class="file-meta">
        <span class="file-name">التحميل.apk</span>
        <span class="file-perc" id="perc1">0%</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="fill1"></div>
      </div>
      <div class="details">
        <span id="bytes1">0 / 0 KB</span>
        <span id="state1">IDLE</span>
      </div>
    </div>

    <div class="file-box">
      <div class="file-meta">
        <span class="file-name">تطبيق الحضور للكمبيوتر.html</span>
        <span class="file-perc" id="perc2">0%</span>
      </div>
      <div class="bar-bg">
        <div class="bar-fill" id="fill2"></div>
      </div>
      <div class="details">
        <span id="bytes2">0 / 0 KB</span>
        <span id="state2">IDLE</span>
      </div>
    </div>

    <button class="btn-action" id="startBtn" onclick="startRealDownloads()">[ START_REAL_FETCH ]</button>
  </div>

  <script>
    // تفعيل الإشعارات
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function notifyUser(filename) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("DOWNLOAD_COMPLETE", {
          body: `File successfully fetched: ${filename}`
        });
      }
    }

    // دالة التحميل الحقيقي بقراءة الـ Stream
    async function downloadRealFile(url, filename, fillId, percId, bytesId, stateId) {
      const fill = document.getElementById(fillId);
      const perc = document.getElementById(percId);
      const bytes = document.getElementById(bytesId);
      const state = document.getElementById(stateId);

      state.innerText = "CONNECTING...";

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP_ERROR");

        const contentLength = response.headers.get('content-length');
        const total = contentLength ? parseInt(contentLength, 10) : 0;
        let loaded = 0;

        const reader = response.body.getReader();
        const chunks = [];

        state.innerText = "STREAMING...";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          chunks.push(value);
          loaded += value.length;

          // حساب العداد الحقيقي بناءً على حجم البيانات المحملة فعلياً
          if (total > 0) {
            const percent = Math.round((loaded / total) * 100);
            fill.style.width = percent + "%";
            perc.innerText = percent + "%";
            bytes.innerText = `${(loaded / 1024).toFixed(1)} / ${(total / 1024).toFixed(1)} KB`;
          } else {
            // في حال عدم توفر Content-Length من السيرفر
            fill.style.width = "100%";
            perc.innerText = "FETCHING...";
            bytes.innerText = `${(loaded / 1024).toFixed(1)} KB`;
          }
        }

        // تحويل البيانات المحملة إلى ملف وتنزيله في الجهاز
        const blob = new Blob(chunks);
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(downloadUrl);

        state.innerText = "COMPLETE ✓";
        fill.style.backgroundColor = "var(--green)";
        notifyUser(filename);

      } catch (err) {
        // Fallback في حال وجود قيود أمان على الـ CORS من السيرفر
        state.innerText = "DIRECT_DOWNLOAD";
        fill.style.width = "100%";
        perc.innerText = "100%";
        
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.target = "_blank";
        document.body.appendChild(a);
        a.click();
        a.remove();
        notifyUser(filename);
      }
    }

    async function startRealDownloads() {
      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      btn.innerText = "[ PROCESSING... ]";

      const file1 = "https://raw.githubusercontent.com/x7oud3-ai/-APK/main/الحضور.apk";
      const file2 = "https://raw.githubusercontent.com/x7oud3-ai/-APK/main/تطبيق%20الحضور%20للكمبيوتر.html";

      // تشغيل التنزيل للملفين في نفس الوقت 
      await Promise.all([
        downloadRealFile(file1, "الحضور.apk", "fill1", "perc1", "bytes1", "state1"),
        downloadRealFile(file2, "تطبيق الحضور للكمبيوتر.html", "fill2", "perc2", "bytes2", "state2")
      ]);

      btn.innerText = "[ ALL_DOWNLOADS_FINISHED ]";
    }
  </script>
</body>
</html>
