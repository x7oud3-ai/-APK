<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مركز التحميل الإحترافي</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.8);
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
      --green: #2ea043;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --border: #30363d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 0%, rgba(47, 129, 247, 0.15), transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* كارت المعاينة للملف المضغوط */
    .preview-box {
      background: rgba(13, 17, 23, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .archive-name {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--accent-hover);
    }

    .badge {
      background: rgba(47, 129, 247, 0.15);
      color: var(--accent-hover);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .file-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-sub);
    }

    /* قسم التحميل والعداد */
    .progress-section {
      margin-bottom: 20px;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 8px;
    }

    .status-text {
      color: var(--text-sub);
    }

    .percentage {
      font-weight: 600;
      color: var(--accent-hover);
    }

    .progress-bg {
      background-color: var(--border);
      border-radius: 20px;
      height: 8px;
      width: 100%;
      overflow: hidden;
    }

    .progress-fill {
      background: linear-gradient(90deg, #2f81f7, #58a6ff);
      height: 100%;
      width: 0%;
      border-radius: 20px;
      transition: width 0.15s ease;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      background-color: #21262d;
      color: var(--text-sub);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <h2>تنزيل ملفات التطبيق</h2>
      <p>تحميل الآرشيف الكامل بصيغة مضغوطة</p>
    </div>

    <div class="preview-box">
      <div class="preview-header">
        <span class="archive-name">Attendance_Bundle.zip</span>
        <span class="badge">ZIP</span>
      </div>
      <div class="file-list">
        <div class="file-item">
          <span>الذين الحضور.apk</span>
          <span>تطبيق أندرويد</span>
        </div>
        <div class="file-item">
          <span>تطبيق الحضور للكمبيوتر.html</span>
          <span>نسخة الويب</span>
        </div>
      </div>
    </div>

    <div class="progress-section">
      <div class="status-bar">
        <span class="status-text" id="statusText">جاهز للتحميل</span>
        <span class="percentage" id="percText">0%</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <button class="btn" id="startBtn" onclick="downloadZip()">تنزيل الملف المضغوط</button>
  </div>

  <script>
    // طلب إذن الإشعار
    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    function sendNotification() {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("تم اكتمال التحميل", {
          body: "تم تنزيل الحزمة المضغوطة Attendance_Bundle.zip بنجاح."
        });
      }
    }

    async function fetchFile(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error("فشل في جلب البيانات");
      return await response.blob();
    }

    async function downloadZip() {
      const btn = document.getElementById('startBtn');
      const fill = document.getElementById('progressFill');
      const perc = document.getElementById('percText');
      const status = document.getElementById('statusText');

      btn.disabled = true;
      btn.innerText = "جاري تحضير الملفات...";

      const zip = new JSZip();
      const files = [
        { name: "الحضور.apk", url: "https://raw.githubusercontent.com/x7oud3-ai/-APK/main/الحضور.apk" },
        { name: "تطبيق الحضور للكمبيوتر.html", url: "https://raw.githubusercontent.com/x7oud3-ai/-APK/main/تطبيق%20الحضور%20للكمبيوتر.html" }
      ];

      try {
        status.innerText = "جاري جلب الملفات...";
        
        // جلب الملفين
        const blob1 = await fetchFile(files[0].url);
        fill.style.width = "25%";
        perc.innerText = "25%";

        const blob2 = await fetchFile(files[1].url);
        fill.style.width = "50%";
        perc.innerText = "50%";

        zip.file(files[0].name, blob1);
        zip.file(files[1].name, blob2);

        status.innerText = "جاري ضغط الملفات...";

        // ضغط الملفات مع عرض النسبة المئوية الحيّة
        const zipContent = await zip.generateAsync({ type: "blob" }, function update(metadata) {
          const totalPerc = Math.round(50 + (metadata.percent / 2));
          fill.style.width = totalPerc + "%";
          perc.innerText = totalPerc + "%";
        });

        // تنزيل تلقائي للـ Zip
        status.innerText = "اكتمل التنزيل بنجاح";
        perc.style.color = "var(--green)";
        fill.style.background = "var(--green)";

        const link = document.createElement('a');
        link.href = URL.createObjectURL(zipContent);
        link.download = "Attendance_Bundle.zip";
        document.body.appendChild(link);
        link.click();
        link.remove();

        sendNotification();
        btn.innerText = "تم التنزيل";

      } catch (err) {
        status.innerText = "حدث خطأ أثناء التنزيل";
        btn.disabled = false;
        btn.innerText = "إعادة المحاولة";
      }
    }
  </script>
</body>
</html>
